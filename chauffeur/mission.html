<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111d">
<title>Mission partenaire — OuassVTC</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101c;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:18px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}.brand img{width:52px;height:52px;border-radius:14px}.card{background:#101b2a;border:1px solid #2b4c73;border-radius:22px;padding:18px;box-shadow:0 18px 50px #0006}.eyebrow{color:#7fb2f2;font-size:12px;font-weight:900}.status{display:inline-block;margin:10px 0 16px;padding:8px 11px;border-radius:999px;background:#173d70;color:#dbeaff;font-size:12px;font-weight:900}.route{display:grid;gap:12px;margin:15px 0}.route div{padding:13px;border-radius:14px;background:#162337}.route small{display:block;color:#91a5bd;margin-bottom:4px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meta div{padding:11px;border-radius:12px;background:#0b1522}.meta small{display:block;color:#91a5bd}.call{display:block;margin:14px 0;padding:14px;border-radius:14px;background:#0b8b50;color:#fff;text-decoration:none;text-align:center;font-weight:950}.actions{display:grid;gap:9px;margin-top:15px}.actions button{min-height:52px;border:0;border-radius:14px;background:#176ef4;color:#fff;font-size:15px;font-weight:950}.actions button.secondary{background:#27384e}.actions button.danger{background:#a62931}.actions button:disabled{opacity:.45}.error{padding:18px;border-radius:16px;background:#451b22;color:#ffd8dc}.hidden{display:none!important}.note{margin-top:12px;color:#a8b8cb;font-size:12px;line-height:1.5}
</style>
</head>
<body><main class="wrap"><div class="brand"><img src="/ouassvtc-app.png" alt="OuassVTC"><div><strong>OuassVTC</strong><br><small>Mission chauffeur partenaire</small></div></div><div id="loading" class="card">Chargement sécurisé de la mission…</div><div id="error" class="error hidden"></div><section id="mission" class="card hidden"><div class="eyebrow" id="driverName"></div><h1 id="customerName">Mission</h1><span class="status" id="status"></span><div class="route"><div><small>Départ</small><strong id="pickup"></strong></div><div><small>Destination</small><strong id="destination"></strong></div></div><div class="meta"><div><small>Date / heure</small><strong id="when"></strong></div><div><small>Passagers</small><strong id="passengers"></strong></div><div><small>Paiement</small><strong id="payment"></strong></div><div><small>Tarif</small><strong id="price"></strong></div></div><a id="call" class="call" href="#">📞 Appeler le client</a><p class="note" id="notes"></p><div class="actions" id="actions"></div><p class="note">Ce lien est personnel à cette mission. Ne le transférez pas à une autre personne.</p></section></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyA0DXbsmSkymE55YZfZytGa-newiXBw2lU",authDomain:"ouassvtc-chauffeur-da466.firebaseapp.com",projectId:"ouassvtc-chauffeur-da466",storageBucket:"ouassvtc-chauffeur-da466.firebasestorage.app",messagingSenderId:"394811166195",appId:"1:394811166195:web:23da8a59731c22c6f51686"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),$=id=>document.getElementById(id),token=new URLSearchParams(location.search).get("token")||"";
const labels={proposed:"Course proposée",accepted:"Course acceptée",en_route:"En route vers le client",arrived:"Arrivé au point de prise en charge",passenger_onboard:"Client à bord",completed:"Course terminée",refused:"Course refusée",no_show:"Client absent",problem:"Problème signalé"};
const next={proposed:[["Accepter la course","accepted",""] ,["Refuser","refused","danger"]],accepted:[["Je pars vers le client","en_route",""]],en_route:[["Je suis arrivé","arrived",""]],arrived:[["Client à bord","passenger_onboard",""] ,["Client absent","no_show","danger"]],passenger_onboard:[["Course terminée","completed",""]],completed:[],refused:[],no_show:[],problem:[]};
function showError(message){$("loading").classList.add("hidden");$("mission").classList.add("hidden");$("error").textContent=message;$("error").classList.remove("hidden")}
function expired(data){const d=data.expiresAt?.toDate?.();return d&&d.getTime()<Date.now()}
function render(data){if(expired(data)){showError("Ce lien de mission a expiré.");return}$("loading").classList.add("hidden");$("error").classList.add("hidden");$("mission").classList.remove("hidden");$("driverName").textContent=data.driverName?`Mission pour ${data.driverName}`:"Mission OuassVTC";$("customerName").textContent=data.customerName||"Client";$("status").textContent=labels[data.status]||data.status||"Mission";$("pickup").textContent=data.pickup||"Non renseigné";$("destination").textContent=data.destination||"Non renseigné";$("when").textContent=data.scheduledAtText||"À confirmer";$("passengers").textContent=data.passengers||"Non précisé";$("payment").textContent=data.paymentMethod||"Non précisé";$("price").textContent=data.estimatedPrice||"Non renseigné";$("notes").textContent=data.customerMessage||"";$("notes").classList.toggle("hidden",!data.customerMessage);const phone=String(data.customerPhone||"").replace(/[^+\d]/g,"");$("call").href=phone?`tel:${phone}`:"#";$("call").classList.toggle("hidden",!phone);$("actions").innerHTML=(next[data.status]||[]).map(([label,status,cls])=>`<button class="${cls}" type="button" data-status="${status}">${label}</button>`).join("");if(!["completed","refused","no_show"].includes(data.status))$("actions").insertAdjacentHTML("beforeend",'<button class="secondary" type="button" data-status="problem">Signaler un problème</button>');$("actions").querySelectorAll("[data-status]").forEach(button=>button.onclick=()=>setStatus(button.dataset.status,button));}
async function setStatus(status,button){button.disabled=true;try{await updateDoc(doc(db,"driverMissions",token),{status,updatedAt:serverTimestamp()})}catch(e){console.error(e);alert("Mise à jour impossible. Vérifiez votre connexion.");button.disabled=false}}
if(!/^[a-f0-9]{64}$/i.test(token))showError("Lien de mission invalide.");else{const ref=doc(db,"driverMissions",token);try{const first=await getDoc(ref);if(!first.exists())showError("Cette mission n’existe plus ou le lien a été révoqué.");else{render(first.data());onSnapshot(ref,snap=>{if(snap.exists())render(snap.data());else showError("Cette mission n’est plus disponible.")},()=>showError("Impossible de synchroniser la mission."));}}catch(e){console.error(e);showError("Accès à la mission refusé. Vérifiez la configuration Firebase.")}}
</script></body></html>
